<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Survey</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8faff;
        }
        .survey-container {
            max-width: 700px;
            margin: auto;
            background: #fff;
            padding: 2rem 2.5rem;
            border-radius: 1rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        h2 {
            color: #0d6efd;
            font-weight: 600;
            margin-bottom: 1rem;
        }
        label {
            font-weight: 500;
        }
        .btn-primary {
            width: 100%;
            padding: 0.75rem;
            font-size: 1.1rem;
            border-radius: 0.5rem;
        }
    </style>
</head>
<body class="py-5">
    <div class="survey-container">
        <h2 class="mb-3 text-center">Customer Satisfaction Survey</h2>
        <p class="text-muted text-center mb-4">
            Thank you for using our queueing system. Please answer honestly. <br>
            Your feedback will help us improve the system.
        </p>

        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Select Department</label>
                <select name="department" class="form-select" required>
                <option value="">-- Select Department --</option>
                {% for dept in departments %}
                <option value="{{ dept.id }}">{{ dept.name }}</option>
            {% endfor %}
            </select>
            </div>


            <div class="mb-3">
                <label class="form-label">Purpose of visit</label>
                <select name="purpose" class="form-select" required>
                    <option value="">-- Select --</option>
                    <option>Enrollment/Registration</option>
                    <option>Payment/Transaction</option>
                    <option>Document Request</option>
                    <option>Consultation/Advising</option>
                    <option>Inquiry/Information Request</option>
                    <option>Other</option>
                </select>
            </div>

            {% for field,label in questions %}
            <div class="mb-3">
                <label class="form-label">{{ label }}</label>
                <select name="{{ field }}" class="form-select" required>
                    <option value="">-- Select --</option>
                    {% for val,text in rating_choices %}
                        <option value="{{ val }}">{{ text }}</option>
                    {% endfor %}
                </select>
            </div>
            {% endfor %}

            <div class="mb-3">
                <label class="form-label">Other comments or suggestions</label>
                <textarea name="feedback" class="form-control" rows="3" placeholder="Write your feedback here..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary">Submit Feedback</button>
        </form>
    </div>
</body>
</html>
