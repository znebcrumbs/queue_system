{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Select Department</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("{% static 'bg/dots.png' %}");
            background-size: contain;
        }
        .main-box {
            max-width: 900px;
            margin: auto;
            padding: 2rem;
            border: 4px solid #000;
            border-radius: 15px;
            background: white;
        }
        .dept-btn {
            width: 100%;
            background: #85d8ff;
            border: none;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .dept-btn:hover { transform: scale(1.05); }
        .dept-btn.active { background: #d6d6d6; }
        .right-panel {
            border: 3px solid black;
            border-radius: 50px;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            padding: 1rem;
        }
    </style>
</head>

<body>
<div class="container py-4">
    <div class="main-box row">

        <!-- LEFT SIDE – DEPARTMENTS -->
        <div class="col-md-4">
            <h4 class="fw-bold mb-3">DEPARTMENTS</h4>
            {% for dept in departments %}
                <button class="dept-btn" data-dept="{{ dept.id }}" onclick="selectDept('{{ dept.id }}', this)">
                    {{ dept.name }}
                </button>
            {% endfor %}
        </div>

        <!-- RIGHT SIDE – FORM -->
        <div class="col-md-8">
            <div id="rightPanel" class="right-panel text-center">
                <h2>Welcome</h2>
             
            </div>
        </div>

    </div>
</div>

<!-- ====================== JAVASCRIPT ========================== -->
<script>
function selectDept(deptId, btn) {
    // Highlight button
    document.querySelectorAll(".dept-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    // Load FORM in right panel
    document.getElementById("rightPanel").innerHTML = `
        <div class="card p-4">
            <h3 class="text-center mb-3">Take a Queue Ticket</h3>
            <form method="POST">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" name="name" class="form-control form-control-lg" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input type="text" name="mobile_number" class="form-control form-control-lg" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control form-control-lg" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Section</label>
                    <input type="text" name="section" class="form-control form-control-lg" required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Select Service</label>
                    <select name="service_type" class="form-select form-select-lg" required>
                        {% for service in services %}
                        <option value="{{ service.id }}">{{ service.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <input type="hidden" name="department" value="${deptId}">

                <button type="submit" class="btn btn-primary w-100 btn-lg">Get Ticket</button>
            </form>
        </div>
    `;
}
</script>

</body>
</html>
