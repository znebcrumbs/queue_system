{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Kiosk</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8faff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            border-radius: 1rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .btn-primary {
            padding: 0.75rem;
            font-size: 1.1rem;
            font-weight: 500;
        }
        h1 {
            color: #0d6efd;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="card p-4 p-md-5 col-12 col-md-6 col-lg-5">
        <h1 class="mb-4 text-center">Take a Queue Ticket</h1>
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Full Name</label>
                <input type="text" name="name" class="form-control form-control-lg" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Mobile Number</label>
                <input type="text" name="mobile_number" class="form-control form-control-lg" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control form-control-lg" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Section</label>
                <input type="text" name="section" class="form-control form-control-lg" required>
            </div>

            <div class="mb-4">
                <label class="form-label">Select Service</label>
                <select name="service_type" class="form-select form-select-lg" required>
                    {% for service in services %}
                    <option value="{{ service.id }}">{{ service.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Select Department</label>
                <select name="department" class="form-select" required>
                    {% for dept in departments %}
                        <option value="{{ dept.id }}" {% if selected_department and dept.id == selected_department.id %}selected{% endif %}>
                    {{ dept.name }}
                </option>
                     {% endfor %}
                </select>
</div>



            <button type="submit" class="btn btn-primary w-100">Get Ticket</button>
        </form>
    </div>
</body>
</html>
