{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Department Selection</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-image: url("{% static 'bg/dots.png' %}");
            background-size: contain;
        }
        .main-box {
            max-width: 900px;
            margin: auto;
            padding: 2rem;
            border: 4px solid #000;
            border-radius: 15px;
            background: white;
        }
        .dept-btn {
            width: 100%;
            background: #85d8ff;
            border: none;
            padding: 12px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            margin-bottom: 12px;
            transition: 0.2s;
        }
        .dept-btn:hover {
            transform: scale(1.05);
        }
        .dept-btn.active {
            background: #d6d6d6;   /* Highlighted button */
        }
        .right-panel {
            border: 3px solid black;
            border-radius: 50px;
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: bold;
        }
    </style>
</head>

<body>
<div class="container py-4">
    <div class="main-box row">

        <!-- LEFT – DEPARTMENTS -->
        <div class="col-md-5">
            <h4 class="fw-bold mb-3">DEPARTMENTS</h4>

            {% for dept in departments %}
                <button 
                    class="dept-btn"
                    data-dept="{{ dept.slug }}"
                    onclick="selectDepartment('{{ dept.slug }}', this)">
                    {{ dept.name }}
                </button>
            {% endfor %}
        </div>

        <!-- RIGHT – PANEL -->
        <div class="col-md-7">
            <div id="rightPanel" class="right-panel">
                Welcome
            </div>
        </div>

    </div>
</div>

<script>
function selectDepartment(slug, btn) {
    // Remove active class first
    document.querySelectorAll(".dept-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");

    // Replace right panel content
    document.getElementById("rightPanel").innerHTML = `
        <div>
            <h2>Fill up</h2>
            <a href="/queues/kiosk/${slug}/" class="btn btn-primary mt-3">Start</a>
        </div>
    `;
}
</script>

</body>
</html>
