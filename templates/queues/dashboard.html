<!DOCTYPE html>
<html>
<head>
    <title>Queue Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .highlight {
            animation: flash 1s ease-in-out;
        }
        @keyframes flash {
            0% { background-color: #d4edda; }
            100% { background-color: white; }
        }
    </style>
</head>
<body class="container mt-4">

    <h1 class="mb-4">Queue Dashboard</h1>

    <h3>Service Types</h3>
    <ul class="list-group mb-4">
        {% for service in services %}
            <li class="list-group-item">{{ service.name }} — {{ service.description }}</li>
        {% empty %}
            <li class="list-group-item">No service types defined yet.</li>
        {% endfor %}
    </ul>

    <h3>Recent Queue Entries</h3>
    <div id="queue-table">
        {% include "q_queues/partials/queue_table.html" %}
    </div>

    <audio id="ding" src="{% static 'sounds/ding.mp3' %}" preload="auto"></audio>

    <script>
        let lastEntryId = null;

        function refreshQueue() {
            $.get("{% url 'queue_list' %}", function(data) {
                let newHtml = $(data.html);
                let newFirstId = newHtml.find("tbody tr:first td:first").text().trim();

                if (lastEntryId && newFirstId !== lastEntryId) {

                    document.getElementById("ding").play();


                    newHtml.find("tbody tr:first").addClass("highlight");
                }

                lastEntryId = newFirstId;
                $("#queue-table").html(newHtml);
            });
        }

        $(document).ready(function() {
            lastEntryId = $("#queue-table tbody tr:first td:first").text().trim();
            setInterval(refreshQueue, 5000);
        });
    </script>
</body>
</html>
