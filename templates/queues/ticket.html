<!DOCTYPE html>
<html>
<head>
    <title>Your Queue Ticket</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<style>
    @media print {
        body * {
            visibility: hidden;
        }
        #printable-ticket, #printable-ticket * {
            visibility: visible;
        }
        #printable-ticket {
            position: absolute;
            left: 0;
            top: 0;
            width: 80mm; /* for thermal printers */
        }
        button { display: none; }
    }
</style>


<body class="container text-center py-5">
    <div id="printable-ticket">
    <h1>Your Ticket</h1>
    <p class="display-4">{{ entry.queue_number }}</p>
    <p>Service: {{ entry.service_type.name }}</p>
    <p>Status: {{ entry.get_status_display }}</p>
    <p>Created at: {{ entry.created_at }}</p>
    <hr>
    <p><strong>QR Code (UUID):</strong> {{ entry.qr_code }}</p>
    <img src="{% url 'generate_qr' entry.id %}" alt="QR Code" class="mt-3" />   
     <button onclick="window.print()" class="btn btn-primary">🖨️ Print Ticket</button>
    </div>
   
</body>
</html>

<script>
    window.onload = () => {
        if (window.location.search.includes("auto_print=1")) {
            window.print();
        }
    }
</script>
