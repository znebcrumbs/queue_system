{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Queue Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .highlight {
            animation: flash 1s ease-in-out;
        }
        @keyframes flash {
            0% { background-color: #d4edda; }
            100% { background-color: white; }
        }
    </style>
</head>
<body class="container mt-4">

    <h1 class="mb-4">Queue Dashboard</h1>

    <h3>Service Types</h3>
    <ul class="list-group mb-4">
        {% for service in services %}
            <li class="list-group-item">{{ service.name }} — {{ service.description }}</li>
        {% empty %}
            <li class="list-group-item">No service types defined yet.</li>
        {% endfor %}
    </ul>

    <h3>Recent Queue Entries</h3>
    <div id="queue-table">
        {% include "q_queues/partials/queue_table.html" %}
    </div>

    <audio id="ding" src="{% static 'sounds/ding.mp3' %}" preload="auto"></audio>

   
<script>
    // last served 
    let lastServed = [];
    // last latest_id. dihens mo nasabatan? louy
    let lastLatestId = null;

    function refreshQueue() {
        $.get("{% url 'queue_list' %}", function(data) {
            // Replace table 
            $("#queue-table").html(data.html);

            // Update Now Serving sa Jollibee ineng hehehehe
            const served = data.served || [];

            if (served.length > 0) {
                const nowHtml = served.slice(0,2).map(n => `<div>${n}</div>`).join("");
                $("#now-serving").html(nowHtml);

                // Play ding ONLY if top served changed 
                if (lastServed.length && served[0] !== lastServed[0]) {
                    const audio = document.getElementById("ding");
                    // try/catch kay i miss her
                    try { audio.play(); } catch(e) { /* ignore autoplay blocks */ }

                    // highlight kay naa na syay lain.
                    $("#now-serving div:first").addClass("highlight");
                    setTimeout(() => $("#now-serving div:first").removeClass("highlight"), 1200);
                }
            } else {
                $("#now-serving").html("<div>---</div>");
            }

            // update snapshots pero basin naa kay snapchat
            lastServed = served;
            lastLatestId = data.latest_id;
        }).fail(function() {
            //  handle errors (if daot ang server huhuh)
            console.warn("Failed to refresh queue list");
        });
    }

    // lastServed from the server-rendered panel on load (if present pero ug absent ah edi no)
    $(document).ready(function() {
        $("#now-serving div").each(function() {
            const t = $(this).text().trim();
            if (t) lastServed.push(t);
        });
        // initialize lastLatestId from first table row in case dili ta mag work
        const firstRow = $("#queue-table tbody tr[data-id]:first");
        if (firstRow.length) lastLatestId = firstRow.data("id");

        // dapat i update ko nimo every 5 seconds
        setInterval(refreshQueue, 5000);
    });
</script>
</body>
</html>
